name: Complaint SLA validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "api/complaint-sla-alerts.js"
      - "api/complaint-sla-alerts.test.js"
      - "client/src/pages/Complaints.tsx"
      - ".github/workflows/complaint-sla-validation.yml"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm test
      - name: Build production bundle
        run: pnpm build
