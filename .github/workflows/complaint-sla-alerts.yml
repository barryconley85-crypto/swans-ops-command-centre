name: Complaint SLA email monitor
# Hourly checks. The API enforces 09:00-17:00 Europe/London, so the
# 08:00 UTC run is safely ignored during GMT and covers 09:00 during BST.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/complaint-sla-alerts.yml"
  schedule:
    - cron: "0 8-16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-complaints:
    runs-on: ubuntu-latest
    steps:
      - name: Check complaint deadlines
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not configured yet, skipping this run."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://swans-ops-command-centre.vercel.app/api/complaint-sla-alerts"
